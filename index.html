<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINEX | تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">MIN<span>EX</span></a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <h1>MIN<span>EX</span></h1>

      <div class="auth-tabs">
        <button id="loginTab" class="active">تسجيل الدخول</button>
        <button id="signupTab">حساب جديد</button>
      </div>

      <p id="referralBanner" class="referral-banner" style="display:none;"></p>

      <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
      <input type="password" id="passwordInput" placeholder="كلمة المرور">

      <button class="submit-btn" id="submitBtn">دخول</button>
      <p class="auth-msg" id="authMsg"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
