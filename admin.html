<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الإدارية | MINEX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap {
      width: 90%;
      max-width: 500px;
      margin: 60px auto;
    }
    .admin-card {
      padding: 30px;
      border: 1px solid #263650;
      border-radius: 18px;
      background: #111b2e;
      margin-bottom: 20px;
    }
    .admin-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #263650;
      background: #0b1220;
      color: #fff;
      box-sizing: border-box;
    }
    .admin-card button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add { background: #45e0a2; color: #0b1220; }
    .btn-sub { background: #f0bd4f; color: #0b1220; }
    .btn-search { background: #2a6df4; color: #fff; }
    #adminPanel { display: none; }
    #resultBox { color: #aab5ca; margin-top: 10px; }
    #msgBox { margin-top: 10px; font-weight: bold; }
    .withdraw-requests { margin-top: 14px; }
    .withdraw-request-item {
      border: 1px solid #263650;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #dfe6f2;
    }
    .withdraw-request-item .wr-row { margin-bottom: 6px; }
    .withdraw-request-item .wr-actions { display: flex; gap: 8px; margin-top: 10px; }
    .withdraw-request-item .wr-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .wr-approve { background: #45e0a2; color: #0b1220; }
    .wr-reject { background: #f04f4f; color: #fff; }
    .empty-note { color: #6b7893; font-size: 13px; }
  </style>
</head>
<body>

  <main class="admin-wrap">

    <!-- قسم تسجيل الدخول -->
    <section class="admin-card" id="loginBox">
      <h2>دخول الإدارة</h2>
      <input type="email" id="adminEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="adminPassword" placeholder="كلمة المرور">
      <button class="btn-search" id="loginBtn">دخول</button>
      <p id="loginMsg" style="color:#f0bd4f;"></p>
    </section>

    <!-- لوحة التحكم (تظهر فقط بعد تسجيل دخول ناجح كأدمن) -->
    <section id="adminPanel">
      <div class="admin-card">
        <h2>بحث عن حساب</h2>
        <input type="text" id="searchSerial" placeholder="رقم الحساب" inputmode="numeric" pattern="[0-9]*">
        <button class="btn-search" id="searchBtn">بحث</button>
        <div id="resultBox"></div>
      </div>

      <div class="admin-card" id="actionsBox" style="display:none;">
        <h2>تعديل رصيد النقاط</h2>
        <input type="number" id="amountInput" placeholder="المبلغ" min="0" step="0.01">
        <button class="btn-add" id="addBtn">شحن (زيادة)</button>
        <button class="btn-sub" id="subBtn">سحب (خفض)</button>
        <p id="msgBox"></p>
      </div>

      <div class="admin-card" id="trxActionsBox" style="display:none;">
        <h2>شحن رصيد TRX</h2>
        <input type="number" id="trxAmountInput" placeholder="المبلغ (TRX)" min="0" step="0.000001">
        <button class="btn-add" id="trxAddBtn">شحن TRX</button>
        <button class="btn-sub" id="trxSubBtn">خصم TRX</button>
        <p id="trxMsgBox"></p>
      </div>

      <div class="admin-card">
        <h2>طلبات السحب المعلّقة</h2>
        <button class="btn-search" id="refreshWithdrawBtn">تحديث الطلبات</button>
        <div id="withdrawRequestsBox" class="withdraw-requests"></div>
      </div>

      <button class="btn-search" id="logoutBtn" style="background:#263650;color:#fff;">تسجيل الخروج</button>
    </section>

  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
